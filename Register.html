<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Hub Portal</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<script src="script.js"></script>
<header>
    <h1>STUDENT HUB PORTAL</h1>
</header>

<form action="home.html">
<h2>Student Registration</h2>
<br>

<label>First Name</label>
<input type="text" placeholder="Enter Your First Name">
<br><br>

<label>Last Name</label>
<input type="text" placeholder="Enter Your Last Name">
<br><br>

<label>Email</label>
<input type="text" placeholder="Enter Your Email">
<br><br>

<label>Username</label>
<input type="text" placeholder="Make Your Username">
<br><br>

<label>Id</label>
<input type="text" placeholder="Enter Student ID ">
<br><br>

<label>Password</label>
<input type="password" placeholder="Enter Password">
<br><br>

<label>Confirm Password</label>
<input type="password" placeholder="Confirm Your Password">
<br><br>

<label>Role</label>

<select>
    <option>Student</option>
    <option>Faculty</option>
    <option>Admin</option>
</select>
<br><br>

<input type="submit" value="Register">

<input type="reset" value="Clear form">

<p>Already User??</p>
<br>
<a href="Login.html" class="login-btn">Login</a>
</form>

<footer>
    <div class="footer-container">
        <div class="footer-section">
            <h2>StudentHub Portal</h2>
            <p>Your digital campus companion for academics, courses, assignments, attendance, and student services.</p>
        </div>
    </div>
    <p class="copyright">
        © 2026 StudentHub Portal | Developed by Hemangi Korat | All Rights Reserved.
    </p>
</footer>
</body>
</html>
